<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Respond to Invite</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<style type="text/tailwindcss">
		@theme {
			--font-heading: "Hammersmith One", sans-serif;
		}
		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-heading);
		}
	</style>
</head>
<body class="bg-white min-h-screen">
	<!-- Top Navigation Bar -->
	<div class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
		<div class="max-w-2xl mx-auto flex justify-between items-center">
			<a href="/" class="text-slate-600 hover:text-blue-600 font-medium flex items-center gap-2">
				← Back to Home
			</a>
			<a href="/" class="text-slate-800 hover:text-blue-600 font-bold">
				Ben & Maaike's Wedding
			</a>
		</div>
	</div>

	<div class="max-w-2xl mx-auto p-8">
		<h1 class="text-4xl font-bold text-slate-600 mb-8">Respond to Invitation</h1>
		
		<div class="mb-8">
			<label for="invite-select" class="block text-sm font-semibold text-slate-700 mb-2">Select your name</label>
			<select 
				id="invite-select" 
				name="inviteId"
				hx-get="/respond/form"
				hx-target="#form-fields"
				hx-trigger="change"
				class="w-full border border-slate-300 rounded px-4 py-2"
			>
				<option value="">-- Choose an invite --</option>
			{{range .}}
			<option value="{{.Invite.Id}}">{{.Invite.DisplayName}}</option>
			{{end}}
			</select>
		</div>

		<div id="form-fields">
			<p class="text-slate-500 italic text-center py-8">Select your name above to begin</p>
		</div>
	</div>
</body>
</html>
