{{define "home"}}<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ben & Maaike 28-08-26</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap" rel="stylesheet">

	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

	<style type="text/tailwindcss">
		@theme {
			--font-heading: "Hammersmith One", sans-serif;
		}
		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-heading);
		}
		
		/* Hero Section with Parallax */
		.hero-section {
			position: relative;
			background-attachment: fixed;
		}
		
		.hero-background {
			background-attachment: fixed;
			background-position: top;
			background-repeat: no-repeat;
			background-size: cover;
		}
		
		.hero-background img {
			animation: parallax-scroll linear forwards;
			transform-origin: center;
		}
		
		@supports (animation: parallax-scroll) {
			.hero-background {
				background-attachment: fixed;
			}
		}
		
		/* Fallback parallax using CSS transform */
		@media (hover: hover) {
			.hero-background {
				will-change: transform;
			}
		}
		
		.hero-card {
			animation: fadeInUp 0.2s ease-out forwards;
			opacity: 0;
		}
		
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
		
		/* Timeline line */
		.timeline-line {
			position: absolute;
			left: 0.75rem;
			top: 0;
			bottom: 0;
			width: 0.5rem;
			background-color: rgb(30, 41, 59);
			z-index: 0;
		}
		
		/* Timeline item container */
		.timeline-item {
			position: relative;
			margin-left: 4rem;
			margin-bottom: 2rem;
		}
		
		/* Timeline dot - hollow circle with border */
		.timeline-dot {
			position: absolute;
			left: 0rem;
			width: 1.5rem;
			height: 1.5rem;
			border-radius: 9999px;
			top: 0;
			background-color: white;
			border-width: 8px;
			z-index: 10;
		}
		
		/* Timeline content */
		.timeline-content {
			/* Normal block flow */
		}
		
		/* Timeline time */
		.timeline-time {
			font-family: monospace;
			font-size: 0.875rem;
			font-weight: 600;
			color: rgb(71, 85, 105);
			display: inline;
			margin-right: 1rem;
		}
		
		/* Timeline title */
		.timeline-title {
			display: inline;
			font-size: 1.25rem;
			font-weight: 700;
			color: rgb(30, 41, 59);
			margin: 0;
		}
		
		/* Timeline description */
		.timeline-description {
			display: block;
			margin-top: 0.25rem;
			margin-bottom: 0;
			color: rgb(71, 85, 105);
		}
		
		/* Sticky footer */
		.sticky-rsvp-footer {
			position: fixed;
			bottom: 0;
			right: 0;
			left: 0;
			background: white;
			border-top: 1px solid rgb(226, 232, 240);
			padding: 1rem;
			box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
			z-index: 40;
		}
	</style>
</head>

<body class="bg-white min-h-screen">
	{{template "hero" .}}
	{{template "timeline" .}}
	{{template "directions" .}}
	{{template "dresscode" .}}
	{{template "contact" .}}
	{{template "rsvp-cta" .}}
	{{template "sticky-footer" .}}

	<script>
		// Parallax scroll effect
		const heroBackground = document.querySelector('.hero-background');
		if (heroBackground) {
			window.addEventListener('scroll', () => {
				const scrollPosition = window.scrollY;
				// Move image up as user scrolls down (parallax effect)
				heroBackground.style.transform = `translateY(${scrollPosition * 0.5}px)`;
			});
		}
	</script>
</body>

</html>
{{end}}
