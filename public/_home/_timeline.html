{{define "timeline"}}<!-- Timeline Section -->
<section class="py-20 px-8 max-w-4xl mx-auto">
	<div class="relative space-y-20">
		<!-- Timeline line background -->
		<div class="absolute left-8 top-0 bottom-0 w-0.5 bg-gradient-to-b from-blue-500 via-green-500 via-orange-500 to-purple-500"></div>

		<!-- 13:00 - Ceremony -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-blue-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				13:00
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">Delft Town Hall</h3>
			<p class="text-slate-600">Wedding Ceremony</p>
		</div>

		<!-- 13:45-14:00 - Drinks Reception -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-green-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				13:45–14:00
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">The Schaapskooi</h3>
			<p class="text-slate-600">Drinks Reception</p>
		</div>

		<!-- 15:00 - Toast -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-green-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				15:00
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">The Schaapskooi</h3>
			<p class="text-slate-600">Toast & Celebrations</p>
		</div>

		<!-- 18:30 - Dinner -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-orange-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				18:30
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">The Schaapskooi</h3>
			<p class="text-slate-600">Dinner</p>
		</div>

		<!-- 20:30 - Evening Reception -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-purple-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				20:30
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">Evening Reception</h3>
			<p class="text-slate-600">The Schaapskooi</p>
		</div>

		<!-- 21:00 - Party Time -->
		<div class="pl-24 relative">
			<div class="timeline-dot bg-purple-500"></div>
			<div class="text-right absolute -right-full pr-4 font-mono text-lg font-semibold text-slate-700 w-28">
				21:00
			</div>
			<h3 class="text-xl font-bold text-slate-800 mb-1">Party Time!</h3>
			<p class="text-slate-600">The Schaapskooi</p>
		</div>
	</div>
</section>
{{end}}
