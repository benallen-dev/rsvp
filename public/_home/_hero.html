{{define "hero"}}<!-- Hero Section -->
<section class="relative min-h-screen lg:min-h-96 overflow-hidden">
	<div class="grid grid-cols-1 lg:grid-cols-5 gap-0 h-full">
		<!-- Image: 40% on desktop -->
		<div class="lg:col-span-2 h-96 lg:h-auto relative">
			<img 
				src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=1200&q=80"
				alt="London Skyline"
				class="w-full h-full object-cover"
			/>
			<!-- Mobile overlay -->
			<div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent lg:hidden"></div>
		</div>

		<!-- Text: 60% on desktop, overlaid on mobile -->
		<div class="lg:col-span-3 flex items-center justify-center lg:justify-start p-8 lg:p-16 relative lg:relative -mt-80 lg:mt-0 lg:bg-white">
			<div class="text-center lg:text-left">
				<h1 class="text-5xl lg:text-6xl font-bold text-white lg:text-slate-800 mb-4">
					Ben & Maaike's Wedding
				</h1>
				<p class="text-3xl lg:text-4xl text-white lg:text-slate-600 font-light">
					28 August 2026
				</p>
			</div>
		</div>
	</div>
</section>
{{end}}
