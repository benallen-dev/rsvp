{{define "search-tpl"}}

{{range .Invites}}
<div class="px-3 py-2 hover:bg-gray-100 cursor-pointer" hx-trigger="click" hx-get="/rsvp/{{.Id}}" hx-target="#rsvp-form"
	hx-on::after-request="
	if(event.detail.successful) {
		document.getElementById('dropdown').innerHTML=''
		document.getElementById('search-input').value=''
	}
	">
	{{.Name}}
</div>
{{end}}
{{end}}
