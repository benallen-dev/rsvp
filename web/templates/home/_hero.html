{{define "hero"}}<!-- Hero Section -->
<section class="hero-section relative h-[50vh] overflow-hidden">
	<!-- Background image with parallax effect -->
	<div class="hero-background absolute inset-0 w-full h-full">
		<img 
			src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=1600&q=80"
			alt="Wedding celebration"
			class="w-full h-full object-cover"
		/>
		<!-- Dark overlay for better text readability -->
		<div class="absolute inset-0 bg-black/30"></div>
	</div>

	<!-- Content - centered card with text -->
	<div class="relative h-full flex items-center justify-center px-8 py-16">
		<div class="hero-card bg-white rounded-2xl shadow-2xl p-12 max-w-2xl w-full">
			<div class="text-center">
				<h1 class="text-5xl lg:text-6xl font-bold text-slate-800 mb-4">
					Ben & Maaike<br />
					Allen-Knot
				</h1>
				<p class="text-3xl lg:text-4xl text-slate-600 font-light">
					28 August 2026
				</p>
			</div>
		</div>
	</div>
</section>
{{end}}
