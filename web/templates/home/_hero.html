{{define "hero"}}
<script>
	// Parallax scroll effect
	document.addEventListener('DOMContentLoaded', function (e) {

		const heroBackground = document.getElementById('hero-background');
		if (heroBackground) {
			window.addEventListener('scroll', () => {
				const scrollPosition = window.scrollY;
				// Move image up as user scrolls down (parallax effect)
				heroBackground.style.transform = `translateY(${scrollPosition * 0.5}px)`;
			});
		}
	}, true);
</script>

<!-- do not change this id -->
<section id="hero" class="bg-fixed relative h-[60vh] xs:h-[50vh] overflow-hidden">
	<div id="hero-background"
		class="hover:will-change-transform bg-fixed bg-top bg-no-repeat bg-cover absolute inset-0 w-full h-full">
		<img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=1600&q=80" alt="Achtergrondfoto"
			class="origin-center w-full h-full object-cover" />
		<div class="absolute inset-0 bg-black/40"></div>
	</div>

	<!-- Content - centered card with text -->
	<div class="relative h-full flex items-center justify-center px-8 py-8 sm:py-16">
		<div class="animate-fade-in-up opacity-0 bg-white rounded-2xl shadow-2xl p-12 max-w-2xl w-full">
			<div class="text-center">
				<h1 class="text-3xl sm:text-5xl lg:text-6xl font-bold text-slate-800 mb-4">
					Ben & Maaike<br />
					Allen-Knot
				</h1>
				<p class="text-xl sm:text-3xl lg:text-4xl text-slate-600 font-light">
					28 Augustus 2026
				</p>
			</div>
		</div>
	</div>
</section>
{{end}}
