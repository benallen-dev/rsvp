{{define "base"}}

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{block "title" .}}Ben & Maaike 28-08-2026{{end}}</title>

	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
	<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
	<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">

	<!-- todo: vendor in -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Poppins&display=swap" rel="stylesheet">

	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	{{block "head" .}}{{end}}

	<style type="text/tailwindcss">
		@theme {
			--breakpoint-xs: 26rem;

			--font-heading: "Hammersmith One", sans-serif;
			--font-sans: Poppins, sans-serif;

			--color-tfl-blue: rgb(30,41,59);
			--color-tfl-gray: rgb(71,85,105);
			--color-whatsapp-green: #25D366;
			--color-whatsapp-green-dark: #20ba5a;

			--animate-parallax: parallax-scroll linear forwards;
			--animate-fade-in-up: fadeInUp 0.2s ease-out forwards;

			--shadow-up: 0 -1px 3px 0 var(--tw-shadow-color, rgb(0 0 0 / 0.1)), 0 -1px 2px -1px var(--tw-shadow-color, rgb(0 0 0 / 0.1));

			@keyframes fadeInUp {
				from {
					opacity: 0;
					transform: translateY(30px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		}

		html {
			scroll-behavior: smooth;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-heading);
		}
		
		/* Top menu */
		#main-nav a {
			@apply font-medium border-b-2 border-transparent transition-colors duration-300;
		}
			
		#main-nav a.active {
			@apply font-bold border-b-2 border-b-red-600;
		}

		#main-nav a:hover {
			@apply border-b border-b-red-600/60
		}
	</style>

</head>

<body class="bg-white h-screen">
	<!-- Fixed header -->
	<nav id="main-nav" class="h-20 fixed top-0 left-0 right-0 bg-white shadow z-10">
		<div class="max-w-7xl mx-auto pt-8 px-4 pb-4 space-x-4 whitespace-nowrap overflow-x-scroll">
			{{block "menuitems" .}}{{end}}
		</div>
	</nav>
	<main>
		{{block "content" .}}{{end}}
	</main>

	<script>
		/* Watch scroll events for navlink highlighting */
		const navLinks = document.querySelectorAll('#main-nav a');
		const sections = document.querySelectorAll('section');

		const observer = new IntersectionObserver((entries) => {
			let largest = null;
			let largestArea = 0;

			sections.forEach(section => {
				const rect = section.getBoundingClientRect();
				const area = Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0)) * rect.width;

				if (area > largestArea) {
					largestArea = area;
					largest = section;
				}
			});

			// If near bottom and last section partially visible, highlight it
			if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 100) {
				largest = sections[sections.length - 1];
			}


			if (largest) {
				navLinks.forEach(link => link.classList.remove('active'));
				const id = largest.getAttribute('id');
				const activeLink = id === "hero" ? navLinks[0] : document.querySelector(`a[href="#${id}"]`)
				activeLink?.classList.add('active');
				activeLink?.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
			}
		}, {threshold: [0, 0.25, 0.5, 0.75, 1]});


		sections.forEach(section => observer.observe(section));
	</script>
</body>

</html>

{{end}}
